image: python:3.11-slim

stages:
  - test
  - docker

variables:
  PIP_NO_CACHE_DIR: "1"

python-compile:
  stage: test
  script:
    - python -m compileall app.py chatbot

docker-build:
  stage: docker
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
  rules:
    - if: '$CI_REGISTRY_IMAGE'
